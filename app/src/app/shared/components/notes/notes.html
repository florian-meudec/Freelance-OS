<div class="notes-section">
  <div class="notes-header">
    <h3>Notes</h3>

    <button type="button" class="notes-add-button" (click)="toggleNoteForm()">
      Ajouter une note
    </button>
  </div>
  @if (showNoteForm()) {
    <!--
        Inline note creation keeps CRM interactions
        lightweight and contextual.
      -->
    <div class="note-form" #noteForm>
      <input #noteTitleInput type="text" placeholder="Titre" class="form-input" />

      <textarea #noteContent rows="4" placeholder="Contenu" class="form-textarea"></textarea>

      <div class="form-actions">
        <button
          type="button"
          class="action-button action-button-primary"
          (click)="addNote(noteTitleInput.value, noteContent.value)"
        >
          Ajouter
        </button>

        <button type="button" class="action-button" (click)="toggleNoteForm()">Annuler</button>
      </div>
    </div>
  }

  <div class="notes-list">
    @for (note of sortedNotes(); track note.id) {
      @if (editingNoteId() === note.id) {
        <!--
            Inline note editing preserves context
            while keeping CRM interactions lightweight.
          -->
        <div class="note-form">
          <input #editTitle type="text" class="form-input" [value]="note.title" />

          <textarea #editContent rows="4" class="form-textarea" [value]="note.content"></textarea>

          <div class="form-actions">
            <button
              type="button"
              class="action-button action-button-primary"
              (click)="updateNote(note.id, editTitle.value, editContent.value)"
            >
              Sauvegarder
            </button>

            <button type="button" class="action-button" (click)="cancelNoteEdit()">Annuler</button>
          </div>

          @if (deletingNoteId() === note.id) {
            <div class="delete-confirmation">
              <p>Confirmer suppression ?</p>

              <div class="form-actions">
                <button
                  type="button"
                  class="action-button action-button-danger"
                  (click)="deleteNote(note.id)"
                >
                  Supprimer
                </button>

                <button type="button" class="action-button" (click)="deletingNoteId.set(null)">
                  Annuler
                </button>
              </div>
            </div>
          } @else {
            <button
              type="button"
              class="action-button action-button-danger"
              (click)="confirmNoteDelete(note.id)"
            >
              Supprimer
            </button>
          }
        </div>
      } @else {
        <button
          type="button"
          class="note-card note-card-interactive"
          (click)="startNoteEdit(note.id)"
          aria-label="Modifier la note"
        >
          <div class="note-header">
            <strong>
              {{ note.title }}
            </strong>

            <span>
              {{ note.createdAt | dateFormat: 'datetime' }}
            </span>
          </div>

          <p>
            {{ note.content }}
          </p>
        </button>
      }
    }
  </div>
</div>
