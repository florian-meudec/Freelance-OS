<div class="status-menu">
  <button type="button" class="action-button" (click)="toggle()">
    {{ selectedLabel() }}
  </button>

  @if (opened()) {
    <div class="status-dropdown">
      @for (option of options(); track option.value) {
        <button
          type="button"
          class="status-option"
          [class.status-option-active]="selectedValue() === option.value"
          [disabled]="option.disabled"
          (click)="selectOption(option.value)"
        >
          {{ option.label }}
        </button>
      }
    </div>
  }
</div>
