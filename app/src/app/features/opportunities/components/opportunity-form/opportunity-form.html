<app-modal (closed)="requestClose()" [size]="'large'">
  <form
    class="opportunity-form"
    [formGroup]="form"
    [class.inactive]="showDiscardChangesModal()"
    [inert]="showDiscardChangesModal()"
    (ngSubmit)="submit()"
  >
    <div class="form-header">
      <div>
        <h2>{{ title() }}</h2>
      </div>

      <button
        type="button"
        class="action-button action-button-icon"
        (click)="requestClose()"
        aria-label="Fermer"
      >
        ✕
      </button>
    </div>

    <div class="form-body">
      <div class="form-section">
        <h3>Entreprise</h3>

        <div class="form-grid">
          <div class="form-field">
            <label for="companyName" class="form-label form-label-required">Entreprise</label>

            <input
              id="companyName"
              class="form-input"
              formControlName="companyName"
              autocomplete="organization"
            />
          </div>

          <div class="form-field">
            <label for="companyType" class="form-label">Type</label>

            <app-select-menu [options]="companyTypes" formControlName="companyType" />
          </div>

          <div class="form-field">
            <label for="industry" class="form-label">Secteur</label>

            <input id="industry" class="form-input" formControlName="industry" />
          </div>

          <div class="form-field">
            <label for="source" class="form-label form-label-required">Source</label>

            <input id="source" class="form-input" formControlName="source" />
          </div>
        </div>
      </div>

      <div class="form-section">
        <h3>Contact</h3>

        <div class="form-grid">
          <div class="form-field">
            <label for="contactName" class="form-label">Nom</label>

            <input
              id="contactName"
              class="form-input"
              formControlName="contactName"
              autocomplete="name"
            />
          </div>

          <div class="form-field">
            <label for="contactRole" class="form-label">Poste</label>

            <input id="contactRole" class="form-input" formControlName="contactRole" />
          </div>

          <div class="form-field form-grid-full">
            <label for="contactEmail" class="form-label">Email</label>

            <input
              id="contactEmail"
              type="email"
              class="form-input"
              formControlName="contactEmail"
              autocomplete="email"
              placeholder="prenom.nom@entreprise.fr"
            />
          </div>
        </div>
      </div>

      <div class="form-section">
        <h3>Mission</h3>

        <div class="form-field">
          <label for="missionTitle" class="form-label form-label-required">Titre</label>

          <input id="missionTitle" class="form-input" formControlName="missionTitle" />
        </div>

        <div class="form-field">
          <label for="description" class="form-label">Description</label>

          <textarea
            id="description"
            rows="5"
            class="form-textarea"
            formControlName="description"
          ></textarea>
        </div>
      </div>

      <div class="form-section">
        <h3>Conditions</h3>

        <div class="form-grid">
          <div class="form-field">
            <label for="tjm" class="form-label">TJM</label>

            <input id="tjm" type="number" min="0" class="form-input" formControlName="tjm" />
          </div>

          <div class="form-field">
            <label for="daysPerWeek" class="form-label">Charge</label>

            <input
              id="daysPerWeek"
              type="number"
              min="0"
              class="form-input"
              formControlName="daysPerWeek"
            />
          </div>

          <div class="form-field">
            <label for="modality" class="form-label">Modalité</label>

            <app-select-menu [options]="modalities" formControlName="modality" />
          </div>

          <div class="form-field">
            <label for="location" class="form-label">Localisation</label>

            <input id="location" class="form-input" formControlName="location" />
          </div>
        </div>
      </div>

      <div class="form-section">
        <h3>Planning</h3>

        <div class="form-grid">
          <div class="form-field">
            <label for="estimatedStartDate" class="form-label">Début estimé</label>

            <input
              id="estimatedStartDate"
              type="date"
              class="form-input"
              formControlName="estimatedStartDate"
            />
          </div>

          <div class="form-field">
            <label for="durationValue" class="form-label">Durée</label>

            <div class="duration-fields">
              <input
                id="durationValue"
                type="number"
                min="0"
                class="form-input"
                formControlName="durationValue"
              />

              <app-select-menu [options]="durationUnits" formControlName="durationUnit" />
            </div>
          </div>
        </div>
      </div>

      <div class="form-section">
        <h3>Expertise</h3>

        <div class="form-grid">
          <div class="form-field">
            <label for="seniority" class="form-label">Séniorité</label>

            <app-select-menu [options]="seniorities" formControlName="seniority" />
          </div>

          <div class="form-field form-grid-full">
            <label for="stack" class="form-label">Stack</label>

            <input
              id="stack"
              class="form-input"
              formControlName="stack"
              placeholder="Angular, Spring Boot, PostgreSQL..."
            />
          </div>
        </div>
      </div>

      <!--
        New opportunities always require an initial
        follow-up action to enter the recruitment workflow.
      -->
      @if (!isEditMode()) {
        <div class="form-section">
          <h3>Prochaine action</h3>

          <div class="form-grid" formGroupName="nextAction">
            <div class="form-field">
              <label for="nextActionType" class="form-label form-label-required"> Type </label>

              <app-select-menu [options]="nextActionTypes" formControlName="type" />
            </div>

            <div class="form-field">
              <label for="nextActionDate" class="form-label form-label-required"> Date </label>

              <input id="nextActionDate" type="date" class="form-input" formControlName="dueDate" />
            </div>

            <div class="form-field form-grid-full">
              <label for="nextActionLabel" class="form-label form-label-required">
                Description
              </label>

              <input id="nextActionLabel" class="form-input" formControlName="label" />
            </div>
          </div>
        </div>
      }
    </div>

    <div class="form-footer">
      <button type="button" class="action-button action-button-secondary" (click)="requestClose()">
        Annuler
      </button>
      <button type="submit" class="action-button action-button-primary" [disabled]="form.invalid">
        {{ submitLabel() }}
      </button>
    </div>
  </form>
</app-modal>

@if (showDiscardChangesModal()) {
  <app-discard-changes-modal
    (cancelled)="cancelDiscardChanges()"
    (confirmed)="confirmDiscardChanges()"
  />
}
