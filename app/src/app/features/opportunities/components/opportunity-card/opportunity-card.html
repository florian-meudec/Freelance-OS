<!--
  Cards use a div with role="button" instead of a native button
  to stay compatible with drag & drop interactions.
-->
<div
  class="opportunity-card"
  [class.selected]="selected()"
  role="button"
  tabindex="0"
  (click)="onCardClick()"
  (keydown.enter)="onCardClick()"
  (keydown.space)="onCardClick()"
>
  <!--
    Header color reflects the urgency level
    of the next follow-up action.
  -->
  <div class="card-header" [class]="headerClass()">
    <h3>{{ opportunity().companyName }}</h3>

    <p>{{ opportunity().missionTitle }}</p>
  </div>

  <div class="card-content">
    <div class="card-section">
      <span>{{ opportunity().tjm | tjm }}</span>
      <span>{{ opportunity().workload | workload }}</span>
    </div>

    <div class="card-section">
      <span>{{ modalityLabel() }}</span>
      <span>{{ opportunity().location }}</span>
    </div>

    <!--
      Follow-up section highlights the next actionable step
      to keep the board focused on ongoing opportunities.
    -->
    <div class="card-follow-up">
      <strong>{{ opportunity().nextAction }}</strong>

      <span>
        {{ opportunity().nextActionDate | dateFormat: 'date' }}
      </span>
    </div>
  </div>
</div>
