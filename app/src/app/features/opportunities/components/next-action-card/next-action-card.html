<div class="details-subsection">
  <h4>Suivi</h4>

  @if (nextAction(); as nextAction) {
    @if (nextActionMode() !== 'view') {
      <div class="event-form">
        <div class="form-field">
          <span>Type d'action</span>

          <div class="status-menu">
            <button type="button" class="action-button" (click)="toggleNextActionTypeMenu()">
              {{ currentNextActionTypeLabel() }}
            </button>

            @if (showNextActionTypeSelector()) {
              <div class="status-dropdown">
                @for (eventType of manualEventTypes; track eventType.value) {
                  <button
                    type="button"
                    class="status-option"
                    [class.status-option-active]="currentNextActionType() === eventType.value"
                    (click)="selectNextActionType(eventType.value)"
                  >
                    {{ eventType.label }}
                  </button>
                }
              </div>
            }
          </div>
        </div>

        <label class="form-field">
          <span>Description</span>

          <input
            #nextActionLabel
            class="form-input"
            [value]="nextActionMode() === 'create' ? '' : nextAction.label"
          />
        </label>

        <label class="form-field">
          <span>Date</span>

          <input
            #nextActionDate
            type="date"
            class="form-input"
            [value]="nextActionMode() === 'create' ? '' : nextAction.dueDate"
          />
        </label>

        <div class="form-actions">
          <button
            type="button"
            class="action-button action-button-primary"
            (click)="save(nextActionLabel.value, nextActionDate.value)"
          >
            Sauvegarder
          </button>
          <button type="button" class="action-button" (click)="close()">Annuler</button>
        </div>
      </div>
    } @else {
      <div class="next-action-card">
        <strong>
          {{ nextAction.label }}
        </strong>

        <span>
          {{ nextAction.dueDate | dateFormat: 'date' }}
        </span>

        <div class="form-actions">
          <button type="button" class="action-button" (click)="open()">Modifier</button>

          <button
            type="button"
            class="action-button action-button-primary"
            (click)="completeAction()"
          >
            Terminer l'action
          </button>
        </div>
      </div>
    }
  }
</div>
