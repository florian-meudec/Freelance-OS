<div class="details-subsection" #container>
  <h4>Suivi</h4>

  @if (nextActionMode() !== 'view') {
    <form class="event-form" [formGroup]="form" (ngSubmit)="save()">
      <div class="form-field">
        <span>Type d'action</span>

        <app-select-menu
          [options]="manualEventTypes"
          [selected]="form.controls.type.value"
          (selectionChange)="selectNextActionType($event)"
        />
      </div>

      <label class="form-field">
        <span>Description</span>

        <input #nextActionLabel class="form-input" [formControl]="form.controls.label" />
      </label>

      <label class="form-field">
        <span>Date</span>

        <input type="date" class="form-input" [formControl]="form.controls.dueDate" />
      </label>

      <div class="form-actions">
        <button type="submit" class="action-button action-button-primary" [disabled]="form.invalid">
          Sauvegarder
        </button>

        @if (!isBlocking()) {
          <button type="button" class="action-button" (click)="close()">Annuler</button>
        }
      </div>
    </form>
  } @else if (nextAction(); as nextAction) {
    <div class="next-action-card">
      <strong>
        {{ nextAction.label }}
      </strong>

      <span>
        {{ nextAction.dueDate | dateFormat: 'date' }}
      </span>

      <div class="form-actions">
        <button type="button" class="action-button" (click)="open()">Modifier</button>

        <button
          type="button"
          class="action-button action-button-primary"
          (click)="completeAction()"
        >
          Terminer l'action
        </button>
      </div>
    </div>
  } @else {
    <p class="empty-state">Aucune prochaine action planifiée.</p>
  }
</div>
